services:
  web:
    # Playwright base image provides Chromium + system deps for the server-side discovery flow.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx vite dev --host 0.0.0.0 --port 8080 --strictPort"
    ports:
      - "3000:8080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - /run/base44/app.env

volumes:
  node_modules:
